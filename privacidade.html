<body><h1>Política de privacidade</h1>
<p>O aplicativo OAuth "rclone" é de uso exclusivo do autor, para copiar arquivos
da própria conta Google Drive. Não coleta, armazena nem compartilha dados de
terceiros. Não há outros usuários.</p>
